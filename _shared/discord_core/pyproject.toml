[project]
name = "discord-core"
version = "0.1.0"
description = "Thin shared library for Discord HTTP-interactions bots (official API v10, no framework)"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "httpx==0.28.1",
    "PyNaCl==1.6.2",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "structlog==26.1.0",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_core"]
