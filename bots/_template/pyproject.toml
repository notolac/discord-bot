[project]
name = "bot-template"
version = "0.1.0"
description = "Bot Template — replace with the bot's purpose"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = ["discord-core"]

[project.optional-dependencies]
gateway = ["discord.py==2.7.1"]

[project.scripts]
bot-template = "bot_template.__main__:main"

[tool.uv.sources]
discord-core = { workspace = true }

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_template"]
